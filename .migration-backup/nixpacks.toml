# Nixpacks build configuration for Railway

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# Install ALL dependencies (including devDeps needed for build)
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run build:server",
  "npm run build"
]

[start]
cmd = "node dist-server/lib/server.js"

[variables]
NODE_ENV = "production"
CI = "false"
