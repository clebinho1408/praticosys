<html lang="pt-BR" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

        }

          margin: 5mm;
          size: A4 portrait;
        }
      }
